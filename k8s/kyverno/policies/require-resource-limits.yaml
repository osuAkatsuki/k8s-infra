apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-resource-limits
  annotations:
    policies.kyverno.io/title: Require Resource Limits
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/description: >-
      Containers should have resource limits defined to prevent
      resource exhaustion and ensure fair scheduling.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: validate-resource-limits
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kyverno
                - kube-flannel
                - grafana
          # Exclude CronJob pods (short-lived, run to completion)
          - resources:
              selector:
                matchExpressions:
                  - key: job-name
                    operator: Exists
      validate:
        message: "Containers must have memory and CPU limits defined."
        pattern:
          spec:
            containers:
              - resources:
                  limits:
                    memory: "?*"
                    cpu: "?*"

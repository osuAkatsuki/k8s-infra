deploymentMode: SingleBinary

mimir:
  structuredConfig:
    common:
      storage:
        backend: s3
        s3:
          endpoint: s3.ca-central-1.wasabisys.com
          region: ca-central-1
          access_key_id: ${WASABI_ACCESS_KEY}
          secret_access_key: ${WASABI_SECRET_KEY}
          insecure: false
          bucket_name: akatsuki-mimir

    blocks_storage:
      backend: s3
      s3:
        bucket_name: akatsuki-mimir
      tsdb:
        dir: /data/tsdb

    limits:
      max_global_series_per_user: 500000
      ingestion_rate: 50000
      ingestion_burst_size: 100000

    compactor:
      data_dir: /data/compactor
      sharding_ring:
        kvstore:
          store: memberlist

    ruler_storage:
      backend: s3
      s3:
        bucket_name: akatsuki-mimir

singleBinary:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  persistence:
    enabled: true
    size: 10Gi

gateway:
  enabled: false

backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0

minio:
  enabled: false

nginx:
  enabled: false

monitoring:
  selfMonitoring:
    enabled: false

metaMonitoring:
  enabled: false

replicas: 1

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

persistence:
  enabled: true
  size: 1Gi

adminUser: admin
adminPassword: ${GRAFANA_ADMIN_PASSWORD}

grafana.ini:
  server:
    root_url: https://grafana.akatsuki.gg
  auth.anonymous:
    enabled: false

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Mimir
        type: prometheus
        url: http://mimir-single-binary.monitoring.svc.cluster.local:8080/prometheus
        access: proxy
        isDefault: true
        jsonData:
          timeInterval: 15s
      - name: Loki
        type: loki
        url: http://loki.monitoring.svc.cluster.local:3100
        access: proxy
        jsonData:
          timeout: 60
          maxLines: 1000

dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: default
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/default

dashboards:
  default:
    kubernetes-cluster:
      gnetId: 7249
      revision: 1
      datasource: Mimir
    kubernetes-pods:
      gnetId: 6336
      revision: 1
      datasource: Mimir
    loki-logs:
      gnetId: 12611
      revision: 1
      datasource: Loki

ingress:
  enabled: true
  ingressClassName: nginx
  hosts:
    - grafana.akatsuki.gg
  tls:
    - secretName: grafana-tls
      hosts:
        - grafana.akatsuki.gg

serviceMonitor:
  enabled: false

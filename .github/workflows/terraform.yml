name: 'Terraform'

on:
  push:
    branches:
    - master
  pull_request:
    branches:
    - master

concurrency:
  group: terraform-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  terraform-validate:
    name: 'Terraform Validate'
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./tf
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - uses: hashicorp/setup-terraform@v4
    - run: terraform fmt -check
    - run: terraform init -backend=false -input=false
    - run: terraform validate

  terraform-deploy:
    name: 'Terraform Plan and Apply'
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: [self-hosted, vpc]
    env:
      DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
      PRIVATE_SSH_KEY: ${{ secrets.PRIVATE_SSH_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_DOMAIN: ${{ secrets.CLOUDFLARE_DOMAIN }}
      DEPLOY_KUBECONFIG: ${{ secrets.KUBECONFIG }}

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v4
      with:
        terraform_wrapper: false

    - name: Write Kubeconfig to Disk
      run: |
        config="$RUNNER_TEMP/terraform-kubeconfig"
        (umask 077 && printf '%s\n' "$DEPLOY_KUBECONFIG" > "$config")
        printf 'KUBECONFIG=%s\n' "$config" >> "$GITHUB_ENV"

    - name: Terraform Init
      working-directory: ./tf
      run: terraform init -input=false -backend-config="config_path=$KUBECONFIG"

    - name: Terraform Format
      working-directory: ./tf
      run: terraform fmt -check

    - name: Terraform Plan
      id: tf-plan
      working-directory: ./tf
      run: |
        export exitcode=0
        terraform plan \
        -var "do_token=$DIGITALOCEAN_TOKEN" \
        -var "pvt_key=$PRIVATE_SSH_KEY" \
        -var "cloudflare_api_token=$CLOUDFLARE_API_TOKEN" \
        -var "cloudflare_zone_id=$CLOUDFLARE_ZONE_ID" \
        -var "cloudflare_account_id=$CLOUDFLARE_ACCOUNT_ID" \
        -var "cloudflare_domain=$CLOUDFLARE_DOMAIN" \
        -lock-timeout=5m \
        -detailed-exitcode \
        -no-color \
        -out tfplan \
        || export exitcode=$?

        echo "exitcode=$exitcode" >> "$GITHUB_OUTPUT"

        case "$exitcode" in
          0|2) exit 0 ;;
          *) exit "$exitcode" ;;
        esac

    - name: Terraform Apply
      if: steps.tf-plan.outputs.exitcode == '2'
      working-directory: ./tf
      run: terraform apply -input=false -lock-timeout=5m tfplan

    - name: Remove deployment files
      if: always()
      run: rm -f tf/tfplan "$RUNNER_TEMP/terraform-kubeconfig"
